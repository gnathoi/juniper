# Juniper flash config for `just flash DEVICE CONFIG`. Copy it OUTSIDE the repo, e.g.
#   install -Dm600 examples/flash.yaml ~/.config/juniper/flash.yaml
# then fill it in. A filled-in copy holds secrets (Tailscale key, Wi-Fi password): keep it
# chmod 600. Applied once, on the Pi's first boot, then wiped from the card.

# juniper (dev tools, Homebrew), juniper-minimal (appliance base) or juniper-desktop
# (experimental niri desktop). Default: juniper.
image: juniper

# juniper-desktop requires a password (just flash asks for it; only a hash is written). It's
# for logging in, and sudo asks for it too. For the headless images it's optional: uncomment
# to be asked (sudo then asks for it as well; without one, sudo needs no password).
# password: prompt

hostname: juniper
user: me                        # your login; password login is off, so SSH keys are required
timezone: Europe/London         # optional; default UTC

ssh_keys:
  - ssh-ed25519 AAAA...replace-me me@laptop
  # Your GitHub keys: gh api user/keys --jq '.[] | "\(.key) \(.title)"'

# First-boot disk encryption (LUKS2 root). Opt-in: off unless you set `encrypt: true`.
# The recovery key is sealed to the ssh-ed25519 / ssh-rsa keys in ssh_keys above, so your SSH
# key FILE (private key) is the recovery key. FIDO (sk-) and ECDSA keys can't be recipients,
# and a key that lives only in an agent can't decrypt: keep the key file somewhere safe.
# With no usable key here, encrypt: true refuses; add one or set recovery_key.
# encrypt: true
# recovery_key: age1...          # optional: an age PUBLIC key, used instead of ssh_keys

# A one-off, pre-approved, TAGGED auth key (https://login.tailscale.com/admin/settings/keys).
# Tagged devices don't expire, so the firewall lockdown can't lock you out. The key turns on
# Tailscale SSH: your tailnet policy needs an "ssh" rule allowing you into that tag.
# Leave both out to log in later with `ujust tailscale-up` (over the LAN).
tailscale_authkey: tskey-auth-replace-me
# tailscale_authkey_file: ~/.config/juniper/tskey   # or read it from a file

# Optional; leave out for Ethernet only.
wifi:
  ssid: My Network
  password: replace-me
  country: GB                   # two-letter regulatory domain

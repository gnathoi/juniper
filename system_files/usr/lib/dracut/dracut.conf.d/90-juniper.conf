# Juniper boots from SD, USB or NVMe with an XFS root (the base image's initramfs is generic:
# 46 MB with network root, VMs, RAID/LVM, TPM/FIDO unlock, FIPS, btrfs and every console
# font). build.sh regenerates the initramfs with this. Kept: systemd, ostree, udev, the
# storage drivers, and crypt/dm for LUKS.
omit_dracutmodules+=" nfs network network-manager net-lib kernel-network-modules "
omit_dracutmodules+=" qemu qemu-net virtiofs walinuxagent "
omit_dracutmodules+=" lvm mdraid nvdimm lunmask "
omit_dracutmodules+=" clevis clevis-pin-null clevis-pin-sss clevis-pin-tang clevis-pin-tpm2 tpm2-tss fido2 pkcs11 "
omit_dracutmodules+=" fips fips-crypto-policies nss-softokn btrfs resume memstrack systemd-pcrphase "
i18n_install_all="no"

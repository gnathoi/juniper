# GPT layout for Pi 4/5. Partition 1 is the Pi firmware partition and doubles as the
# cloud-init NoCloud source (label CIDATA). rpi-bootc-bootloader expects it to be p1.
[[customizations.disk.partitions]]
type = "plain"
label = "CIDATA"
mountpoint = "/boot/efi"
fs_type = "vfat"
minsize = "1 GiB"

[[customizations.disk.partitions]]
type = "plain"
label = "boot"
mountpoint = "/boot"
fs_type = "xfs"
minsize = "1 GiB"

[[customizations.disk.partitions]]
type = "plain"
label = "root"
mountpoint = "/"
fs_type = "xfs"
minsize = "6 GiB"

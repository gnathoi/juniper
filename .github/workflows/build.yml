name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Docs-only pushes skip the image builds; lint-docs.yml lints them instead.
    paths-ignore: ["docs/**", "**/*.md"]
  schedule:
    - cron: "0 2 * * 1"  # Weekly release train: Mondays 02:00 UTC publishes images, disk images and a release
  workflow_dispatch:
    inputs:
      build_raw:
        description: Also build the flashable .raw disk image and a release
        type: boolean
        default: false

concurrency:
  # Publishing runs (weekly train, v* tags, manual runs on main) share one group, so two of
  # them never interleave tag updates; other runs are grouped per ref.
  # yamllint disable-line rule:line-length
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  packages: write

env:
  # Only the weekly train, v* tags and manual runs on main publish; pushes build and test only.
  # yamllint disable-line rule:line-length
  PUBLISH: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  build:
    needs: lint
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        image: [juniper-minimal, juniper]
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps: &build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache /opt/ghc /usr/local/.ghcup
          df -h /

      # After the cleanup: setup-just installs into /opt/hostedtoolcache, which it deletes.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Image metadata
        id: meta
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
          NAMESPACE: ${{ github.repository_owner }}
        run: |
          ref="${REGISTRY}/${NAMESPACE}/${{ matrix.image }}"
          echo "image_ref=${ref,,}" >>"$GITHUB_OUTPUT"
          echo "version=$(date -u +%Y%m%d)" >>"$GITHUB_OUTPUT"

      # cosign v2 on purpose: v3's bundle/referrers format isn't read by containers/image's
      # sigstore-attachments lookup, so devices would reject updates.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2

      - name: Verify pinned Homebrew image signature
        if: matrix.image != 'juniper-minimal'
        run: just verify-brew

      - name: Build and rechunk
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          sudo "$(command -v just)" image="${{ matrix.image }}" image_ref="$IMAGE_REF" version="$VERSION" build rechunk

      - name: Check layers
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: sudo "$(command -v just)" image="${{ matrix.image }}" image_ref="$IMAGE_REF" check-layers

      - name: Image size
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          size=$(sudo podman image inspect --format '{{.Size}}' "$IMAGE_REF:latest")
          echo "### Image size: ${{ matrix.image }}: $((size / 1048576)) MiB (uncompressed)" >>"$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: sudo "$(command -v just)" image="${{ matrix.image }}" image_ref="$IMAGE_REF" test-image "$IMAGE_REF:latest"

      # The Pi kernel only arrives with base rebuilds (build.sh can't upgrade it safely).
      - name: Check for a newer Pi kernel than the base ships
        if: matrix.image == 'juniper-minimal'
        continue-on-error: true
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          # shellcheck disable=SC2016 # expands inside the image
          read -r have want < <(sudo podman run --rm --pull=never "$IMAGE_REF:latest" bash -c '
            echo "$(rpm -q --qf "%{evr}" raspberrypi2-kernel4)" \
              "$(dnf -q repoquery --disablerepo=tailscale-stable --latest-limit 1 --qf "%{evr}" \
                raspberrypi2-kernel4 2>/dev/null | tail -1)"')
          echo "Pi kernel in the image: $have; newest in the repo: ${want:-unknown}"
          if [ -n "$want" ] && [ "$have" != "$want" ]; then
            echo "::warning::AlmaLinux's Pi repo has kernel $want; the base image ships $have"
          fi

      - name: Log in to registry
        if: env.PUBLISH == 'true'
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | sudo podman login -u "$GITHUB_ACTOR" --password-stdin "$REGISTRY"

      - name: Push (sha- tag only; the sign job adds latest once signed)
        id: push
        if: env.PUBLISH == 'true'
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          IMAGE_NAME: ${{ matrix.image }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          creds="$GITHUB_ACTOR:$GITHUB_TOKEN"
          command -v skopeo >/dev/null || sudo apt-get install -y skopeo
          prev=$(skopeo inspect --creds "$creds" "docker://$IMAGE_REF:latest" 2>/dev/null \
            | jq -c '[.LayersData[].Digest]' || echo '[]')
          prev=${prev:-[]}

          # Devices only pull :latest, which never points at an unsigned digest.
          pushed=false
          for i in 1 2 3; do
            if sudo podman push --digestfile /tmp/digest "$IMAGE_REF:latest" \
              "docker://$IMAGE_REF:sha-${GITHUB_SHA::7}"; then
              pushed=true
              break
            fi
            sleep $((10 * i))
          done
          if [ "$pushed" != true ]; then
            echo "::error::failed to push $IMAGE_REF after 3 attempts"
            exit 1
          fi
          mkdir -p digest && cp /tmp/digest "digest/$IMAGE_NAME"

          # Best-effort: a failed report must not fail the step.
          (
            set -o pipefail
            skopeo inspect --creds "$creds" "docker://$IMAGE_REF@$(cat /tmp/digest)" \
              | jq -r --arg name "$IMAGE_NAME" --argjson prev "$prev" '
                [.LayersData[] | select(.Digest as $d | $prev | index($d) | not)] as $new
                | "### Update size: \($name)\n"
                  + "\($new | length) of \(.LayersData | length) layers changed, "
                  + "\((([$new[].Size] | add) // 0) / 104857.6 | round / 10) MiB to download"' \
              >>"$GITHUB_STEP_SUMMARY"
          ) || echo "::warning::update-size report failed for $IMAGE_NAME"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.image }}
          path: digest/${{ matrix.image }}
          retention-days: 3

  # The experimental desktop has its own job chain (build-desktop -> sign-desktop ->
  # disk-desktop), with the same steps as the headless jobs: a desktop failure (a pruned COPR
  # build, say) never blocks signing, disk images or the release of juniper and
  # juniper-minimal, and the desktop is published only when its own build and tests pass.
  build-desktop:
    needs: lint
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        image: [juniper-desktop]
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps: *build-steps

  # The only job besides release that holds SIGNING_SECRET (environment "release": main and
  # v* tags only). It runs no image or build code: cosign, skopeo and the public key.
  sign:
    needs: build
    # yamllint disable-line rule:line-length
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [juniper-minimal, juniper]
    env:
      REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
      VERSION: ${{ needs.build.outputs.version }}
    steps: &sign-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digest
      - name: Image ref and digest
        id: meta
        env:
          NAMESPACE: ${{ github.repository_owner }}
        run: |
          ref="${REGISTRY}/${NAMESPACE}/${{ matrix.image }}"
          echo "image_ref=${ref,,}" >>"$GITHUB_OUTPUT"
          echo "digest=$(cat "digest/${{ matrix.image }}")" >>"$GITHUB_OUTPUT"
      # cosign v2 on purpose: v3's bundle/referrers format isn't read by containers/image's
      # sigstore-attachments lookup, so devices would reject updates.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2

      - name: Sign
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          DIGEST: ${{ steps.meta.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          echo "$GITHUB_TOKEN" | cosign login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE_REF@$DIGEST"
          cosign verify --key system_files/usr/share/pki/containers/juniper.pub "$IMAGE_REF@$DIGEST" >/dev/null

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.image_ref }}@${{ steps.meta.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest SBOM
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          DIGEST: ${{ steps.meta.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          # The full-OS SBOM is too large for the public Rekor log; trust is key-based anyway.
          cosign attest --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY --type spdxjson \
            --predicate sbom.spdx.json "$IMAGE_REF@$DIGEST"
          # No tlog entry exists for the attestation.
          cosign verify-attestation --insecure-ignore-tlog=true \
            --key system_files/usr/share/pki/containers/juniper.pub --type spdxjson "$IMAGE_REF@$DIGEST" >/dev/null

      - name: Tag the signed digest latest and VERSION
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          DIGEST: ${{ steps.meta.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v skopeo >/dev/null || sudo apt-get install -y skopeo
          for tag in latest "$VERSION"; do
            for i in 1 2 3; do
              # Same registry, blobs already there: only the manifest is written.
              skopeo copy --preserve-digests --dest-creds "$GITHUB_ACTOR:$GITHUB_TOKEN" \
                "docker://$IMAGE_REF@$DIGEST" "docker://$IMAGE_REF:$tag" && continue 2
              sleep $((10 * i))
            done
            echo "::error::failed to tag $tag"
            exit 1
          done
          # Devices pull :latest, so check the tag resolves to the signed digest.
          cosign verify --key system_files/usr/share/pki/containers/juniper.pub "$IMAGE_REF:latest" \
            | jq -e --arg d "$DIGEST" '.[0].critical.image."docker-manifest-digest" == $d' >/dev/null

  sign-desktop:
    needs: build-desktop
    # yamllint disable-line rule:line-length
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [juniper-desktop]
    env:
      REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
      VERSION: ${{ needs.build-desktop.outputs.version }}
    steps: *sign-steps

  disk:
    needs: [build, sign]
    # yamllint disable-line rule:line-length
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.build_raw)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [juniper-minimal, juniper]
    env:
      IMAGE: ${{ matrix.image }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', needs.build.outputs.version) }}
    steps: &disk-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: sudo apt-get update && sudo apt-get install -y dosfstools xz-utils jq
      - name: Log in to registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | sudo podman login -u "$GITHUB_ACTOR" --password-stdin ghcr.io
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digest
      - name: Build raw disk
        env:
          REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          # This run's own image (not whatever :latest points to now), signature checked first.
          digest=$(cat "digest/$IMAGE")
          [[ $digest == sha256:* ]] || { echo "no digest from the build job" >&2; exit 1; }
          cosign verify --key system_files/usr/share/pki/containers/juniper.pub "${REF,,}@$digest" >/dev/null
          sudo "$(command -v just)" build-raw "${REF,,}:latest" "$IMAGE-$VERSION.raw" "$digest"
      - name: Compress and render OS list entry
        run: |
          sudo chown "$USER:$(id -gn)" "$IMAGE-$VERSION.raw"
          xz -T0 -k "$IMAGE-$VERSION.raw"
          # The experimental desktop stays out of the Raspberry Pi Imager list (os-list.json).
          if [ "$IMAGE" != juniper-desktop ]; then
            disk/render-os-list.sh "$IMAGE" "$IMAGE-$VERSION.raw" "$IMAGE-$VERSION.raw.xz" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$IMAGE-$VERSION.raw.xz" \
              "$VERSION" >"os-list-$IMAGE.json"
          fi
          rm "$IMAGE-$VERSION.raw"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: disk-${{ matrix.image }}
          path: |
            ${{ matrix.image }}-${{ env.VERSION }}.raw.xz
            os-list-${{ matrix.image }}.json
          retention-days: 3

  disk-desktop:
    needs: [build-desktop, sign-desktop]
    # yamllint disable-line rule:line-length
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.build_raw)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        image: [juniper-desktop]
    env:
      IMAGE: ${{ matrix.image }}
      VERSION: ${{ needs.build-desktop.outputs.version }}
    steps: *disk-steps

  release:
    needs: [build, disk, disk-desktop]
    # The headless disk images are required; the desktop's join the release only when its own
    # chain passed (otherwise disk-desktop failed or was skipped, and the release goes ahead).
    if: ${{ !cancelled() && needs.disk.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', needs.build.outputs.version) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The changelog is stamped on the latest main, which may have moved on since the build.
      # main only accepts pull requests (repository ruleset); RELEASE_DEPLOY_KEY is a write
      # deploy key that is the ruleset's only bypass, for the changelog push below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Release notes from CHANGELOG.md
        run: |
          .github/scripts/changelog.sh unreleased CHANGELOG.md >unreleased.md
          .github/scripts/changelog.sh stamp main/CHANGELOG.md "$TAG" \
            "${VERSION:0:4}-${VERSION:4:2}-${VERSION:6:2}" unreleased.md
          .github/scripts/changelog.sh section main/CHANGELOG.md "$TAG" >notes.md
          if [ ! -s notes.md ]; then
            echo "No Juniper changes; rebuilt on the latest upstream packages." >notes.md
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: disk-*
          merge-multiple: true
      - name: Merge OS lists and checksum
        run: |
          jq -s '{os_list: [.[].os_list[]]}' os-list-juniper.json os-list-juniper-minimal.json >os-list.json
          sha256sum ./*.raw.xz os-list.json >SHA256SUMS
          if compgen -G 'juniper-desktop-*.raw.xz' >/dev/null; then
            echo "" >>notes.md
            echo "**juniper-desktop** (the niri desktop) is experimental and untested on hardware." >>notes.md
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2
      - name: Sign disk images and checksums (ruling R9)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          for f in ./*.raw.xz SHA256SUMS; do
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --bundle "$f.bundle" "$f"
            cosign verify-blob --key system_files/usr/share/pki/containers/juniper.pub --bundle "$f.bundle" "$f"
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: Juniper ${{ env.VERSION }}
          body_path: notes.md
          generate_release_notes: true
          files: |
            *.raw.xz
            *.bundle
            os-list.json
            SHA256SUMS
      # After the release, so the changelog never names a release that doesn't exist.
      # Pushed with the deploy key, so it triggers lint-docs (docs-only: no image build).
      - name: Commit the stamped changelog to main
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            # Re-stamp on a fresh main if a push raced us.
            if [ "$i" -gt 1 ]; then
              git fetch -q origin main && git reset -q --hard origin/main
              ../.github/scripts/changelog.sh stamp CHANGELOG.md "$TAG" \
                "${VERSION:0:4}-${VERSION:4:2}-${VERSION:6:2}" ../unreleased.md
            fi
            if git diff --quiet; then exit 0; fi
            git commit -qam "docs: changelog for $TAG"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((5 * i))
          done
          echo "::error::could not push the changelog for $TAG; move its entries by hand"
          exit 1

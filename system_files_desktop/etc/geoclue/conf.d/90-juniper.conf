# Juniper: nothing looks up this device's location over the network by default. DankMaterialShell
# starts a geoclue client at every login (even with its location and weather off), and geoclue's
# IP and Wi-Fi sources ask an online location service. GPS, modems and a static location
# (/etc/geolocation) still work. To allow network lookups, delete this file or override it in a
# later conf.d file.
[ip]
enable=false

[wifi]
enable=false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-w, -i, "2", -ci]
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        files: (^|/)Containerfile$
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: local
    hooks:
      - id: just-fmt
        name: just --fmt --check
        language: system
        # yamllint disable-line rule:line-length
        entry: bash -c 'for f in Justfile system_files*/usr/share/juniper/just/*.just; do [ -e "$f" ] || continue; just --unstable --fmt --check --justfile "$f"; done'
        files: (Justfile|\.just)$
        pass_filenames: false
      - id: unit-tests
        name: tests/unit.sh
        language: system
        entry: tests/unit.sh
        pass_filenames: false
